<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User profile card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <h1>User Profile Card</h1>

    <div class="card">
        <img class="avatar" src="https://pbs.twimg.com/media/HSZo3FTaUAAKlWN?format=jpg&name=medium" alt="profile picture">
        <table class="info">
            <tr><td>Sitthan Aromprasert</td></tr>
            <tr><td>eval speed running</td></tr>
            <tr><td>42BKK</td></tr>
        </table>
        <div class="socials">
            <img src="https://www.knmasters.com/wp-content/uploads/2025/03/Instagram_logo_2022.svg" alt="instagram">
            <img src="https://store-images.s-microsoft.com/image/apps.37935.9007199266245907.b029bd80-381a-4869-854f-bac6f359c5c9.91f8693c-c75b-4050-a796-63e1314d18c9?h=170" alt="facebook">
        </div>

        <button class="contact-btn">Contact</button>
    </div>
</body>
</html>
